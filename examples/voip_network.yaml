# VoIP Network Simulation Configuration
# Simulates SIP/RTP call traffic, VoIP infrastructure, and unified communications

# VoIP Infrastructure
DOMAIN_CONTROLLER_IP: "10.5.10.10"  # Active Directory for auth
SIP_PROXY_IP: "10.5.11.10"  # SIP Proxy/Registrar
SIP_SERVER_IP: "10.5.11.11"  # SIP Application Server
MEDIA_GATEWAY_IP: "10.5.11.20"  # RTP Media Gateway
VOICEMAIL_SERVER_IP: "10.5.11.30"  # Voicemail/Unified Messaging

# VoIP Phones/Endpoints
WORKSTATION_HOSTS:
  VOIP-PHONE-01: "10.5.20.101"
  VOIP-PHONE-02: "10.5.20.102"
  VOIP-PHONE-03: "10.5.20.103"
  VOIP-PHONE-04: "10.5.20.104"
  VOIP-PHONE-05: "10.5.20.105"
  VOIP-PHONE-06: "10.5.20.106"
  VOIP-PHONE-07: "10.5.20.107"
  VOIP-PHONE-08: "10.5.20.108"
  VOIP-PHONE-09: "10.5.20.109"
  VOIP-PHONE-10: "10.5.20.110"
  SOFTPHONE-01: "10.5.20.201"  # Desktop softphone
  SOFTPHONE-02: "10.5.20.202"
  SOFTPHONE-03: "10.5.20.203"

WORKSTATION_IPS:
  - "10.5.20.101"
  - "10.5.20.102"
  - "10.5.20.103"
  - "10.5.20.104"
  - "10.5.20.105"
  - "10.5.20.106"
  - "10.5.20.107"
  - "10.5.20.108"
  - "10.5.20.109"
  - "10.5.20.110"
  - "10.5.20.201"
