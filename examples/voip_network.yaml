# Admin Workstations (VoIP management)
ADMIN_WORKSTATION_HOSTS:
  VOIP-ADMIN-01: "10.5.30.15"

ADMIN_WORKSTATION_IPS:
  - "10.5.30.15"

# VoIP Traffic Rates
SIP_CALLS_PER_HOUR: 50  # Call setup/teardown signaling
RTP_SESSIONS_PER_HOUR: 50  # Active voice calls
DNS_QUERIES_PER_SEC: 10  # SRV record lookups for SIP
DHCP_LEASES_PER_HOUR: 2  # Phone DHCP renewals
NTP_QUERIES_PER_HOUR: 20  # Time sync for phones
SNMP_POLLS_PER_HOUR: 30  # Phone monitoring
SYSLOG_MESSAGES_PER_HOUR: 80  # Call quality logs

# Supporting Services
HTTP_REQUESTS_PER_SEC: 5  # Phone provisioning/config
SMTP_MESSAGES_PER_HOUR: 10  # Voicemail notifications
IMAP_SESSIONS_PER_HOUR: 5  # Unified messaging

# Default Capture Settings
DEFAULT_CAPTURE_DURATION_MINUTES: 480  # 8 hour call center shift
DEFAULT_CAPTURE_DURATION_SECONDS: 28800

# External DNS Servers
EXTERNAL_DNS_IPS:
  - "8.8.8.8"
  - "8.8.4.4"

# External SIP Trunking Providers
EXTERNAL_DOMAINS:
  - "sip.voip-provider.com"
  - "trunk1.sip-carrier.net"
  - "trunk2.sip-carrier.net"
  - "voip.pstn-gateway.com"

# Business Hours (Call center hours)
BUSINESS_HOUR_START: 9
BUSINESS_HOUR_END: 17
BUSINESS_HOUR_TRAFFIC_MULTIPLIER: 5.0  # High call volume during business hours
OFF_HOUR_TRAFFIC_MULTIPLIER: 0.1  # Minimal after-hours calls

# Ephemeral Port Range (RTP typically uses high ports)
EPHEMERAL_PORT_RANGE:
  - 49152
  - 65535

# RTP Port Range (Media streams)
RTP_PORT_RANGE:
  - 16384
  - 32767
